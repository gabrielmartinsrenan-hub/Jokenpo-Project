<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>DevClub JokenPô</title>
</head>

<body>

    <div class="container">
        <h1>JokenPô</h1>

        <div class="buttons">
            <button id="rock" onclick="playHuman('rock')">👊</button>
            <button id="paper" onclick="playHuman('paper')">🖐️</button>
            <button id="scissors" onclick="playHuman('scissors')">✌️</button>
        </div>

        <p class="result">Escolha uma opção</p>

        <div class="scoreboard">
            <div class="score-card">
                Você
                <p class="your-score"><span id="human-score">0</span></p>
            </div>

            <div class="score-card">
                Alexa
                <p class="alexa-score"><span id="alexa-score">0</span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
